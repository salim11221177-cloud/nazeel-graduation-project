<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>إنشاء حساب جديد</h1>
        <p>أنشئ حسابك للبدء باستخدام خدمات الحجز</p>
    </header>

    <main>

        <section>
            <h2>بيانات المستخدم</h2>

            <form>

                <input
                    type="text"
                    placeholder="الاسم الكامل"
                    required
                >

                <input
                    type="email"
                    placeholder="البريد الإلكتروني"
                    required
                >

                <input
                    type="tel"
                    placeholder="رقم الهاتف"
                    required
                >

                <input
                    type="password"
                    placeholder="كلمة المرور"
                    required
                >

                <input
                    type="password"
                    placeholder="تأكيد كلمة المرور"
                    required
                >

                <button type="submit">
                    إنشاء الحساب
                </button>

            </form>

            <p>
                لديك حساب بالفعل؟
                <a href="login.html">تسجيل الدخول</a>
            </p>

        </section>

    </main>

    <footer>
        <p>الحجز الإلكتروني والخدمات الفندقية والسياحية</p>
    </footer>

</body>

</html>
