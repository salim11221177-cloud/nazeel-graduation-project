<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>تسجيل الدخول</h1>
        <p>مرحبًا بك في منصة الحجز الإلكتروني</p>
    </header>

    <main>

        <section>
            <h2>الدخول إلى حسابك</h2>

            <form>

                <input
                    type="email"
                    placeholder="البريد الإلكتروني"
                    required
                >

                <input
                    type="password"
                    placeholder="كلمة المرور"
                    required
                >

                <button type="submit">
                    تسجيل الدخول
                </button>

            </form>

            <p>
                ليس لديك حساب؟
                <a href="register.html">إنشاء حساب جديد</a>
            </p>

        </section>

    </main>

    <footer>
        <p>الحجز الإلكتروني والخدمات الفندقية والسياحية</p>
    </footer>

</body>

</html>
