<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حجز الفندق | نزيل</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="hotels.html">الفنادق</a>
        <a href="booking.html">الحجز</a>
        <a href="login.html">تسجيل الدخول</a>
        <a href="register.html">إنشاء حساب</a>
    </nav>

    <header>
        <h1>حجز الفندق</h1>
        <p>أدخل بياناتك لإتمام الحجز</p>
    </header>

    <main>

        <section>

            <h2>بيانات الحجز</h2>

            <form id="bookingForm">

                <label for="fullName">الاسم الكامل</label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="أدخل الاسم الكامل"
                    required
                >

                <label for="phone">رقم الهاتف</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="أدخل رقم الهاتف"
                    required
                >

                <label for="email">البريد الإلكتروني</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >

                <label for="checkIn">تاريخ الوصول</label>

                <input
                    type="date"
                    id="checkIn"
                    name="checkIn"
                    required
                >

                <label for="checkOut">تاريخ المغادرة</label>

                <input
                    type="date"
                    id="checkOut"
                    name="checkOut"
                    required
                >

                <label for="guests">عدد الأشخاص</label>

                <input
                    type="number"
                    id="guests"
                    name="guests"
                    min="1"
                    value="1"
                    required
                >

                <button type="submit">
                    تأكيد الحجز
                </button>

            </form>

            <div id="bookingResult"></div>

        </section>

    </main>

    <footer>
        <p>الحجز الإلكتروني والخدمات الفندقية والسياحية</p>
    </footer>

    <script src="booking.js"></script>

</body>

</html>
